[package]
name = "storlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Compact single-host S3-compatible object storage"
license = "Apache-2.0"
repository = "https://github.com/tirtauntario/storlite"
homepage = "https://github.com/tirtauntario/storlite"
readme = "README.md"
keywords = ["s3", "object-storage", "sqlite", "storage", "server"]
categories = ["command-line-utilities", "web-programming::http-server"]
# Distributed as GitHub Release binaries and a GHCR image; see docs/releasing.md
# before publishing to crates.io.
publish = false

[features]
# Test-only crash/fault injection. Never enabled in release builds.
failpoints = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
thiserror = "2"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc = "3"
crc32c = "0.6"
crc32fast = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1", "service"] }
md-5 = "0.10"
percent-encoding = "2"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
toml = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

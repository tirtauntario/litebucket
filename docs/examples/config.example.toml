# storlite configuration.
#
# Generate this file with `storlite config template > config.toml`.
# Lines starting with "# key = value" show the built-in default. To change a
# setting, remove the leading "# " and edit the value. Unknown keys are errors.
# Check your edits with `storlite config check --config config.toml`.
#
# Units: *_bytes are plain integers (1 GiB = 1073741824); durations carry
# their unit in the name (*_seconds, *_ms).

# Relative paths resolve against this file's directory.
data_dir = "./data"

# Region that clients must sign requests for. Fixed when the store is
# initialized; startup refuses a different value later.
region = "us-east-1"

[secrets]
# Access keys live in the metadata database. "encrypted" seals each secret
# with AES-256-GCM under the master key file (`storlite init` creates it if it
# is missing; back it up separately and keep it out of data_dir). "plaintext"
# relies on file permissions only, and every backup then contains usable
# secrets. Changing the mode converts all stored secrets at the next start;
# switching to plaintext needs the master key one last time.
# protection = "encrypted"
master_key_file = "./master.key"

[admin]
# Local admin API used by `storlite admin ...`. Only the server's own user and
# root may connect (checked with the peer's credentials, plus mode 0600).
# socket = "./admin.sock"

[http]
# S3 API listener. Loopback plain HTTP is for local use only.
listen = "127.0.0.1:9000"
allow_insecure_loopback_http = true

# To serve other machines, listen on "0.0.0.0:9000", remove
# allow_insecure_loopback_http, and set a TLS certificate chain and private
# key (PEM). Loaded at startup: restart after renewing the certificate.
# tls_certificate_file = "/etc/storlite/tls.crt"
# tls_private_key_file = "/etc/storlite/tls.key"

# Or serve plain HTTP behind a TLS-terminating proxy on another host. Only the
# listed peer IPs may connect; X-Forwarded-* headers are never trusted.
# trusted_proxy_mode = false
# trusted_proxy_addresses = []          # e.g. ["10.0.0.5"]

# Request limits.
# max_header_bytes = 32768              # 8 KiB .. 1 MiB
# max_header_count = 128                # 16 .. 1024
# max_request_target_bytes = 16384      # 1 KiB .. 64 KiB
# header_timeout_seconds = 10           # 1 .. 600
# body_idle_timeout_seconds = 60        # 1 .. 3600
# max_clock_skew_seconds = 900          # 60 .. 3600, header-signed requests

[management]
# /livez, /readyz and /metrics. Keep this private (loopback or a private network).
listen = "127.0.0.1:9001"
# metrics_enabled = true

[database]
# reader_connections = 2                # 1 .. 32
# writer_queue_capacity = 256
# reader_queue_capacity = 128
# busy_timeout_ms = 5000
# queue_wait_ms = 5000                  # wait for queue space before SlowDown

[limits]
# Concurrency.
# active_uploads = 16
# active_downloads = 64
# active_copies = 2
# active_multipart_assemblies = 2
# admission_timeout_ms = 5000           # wait for a slot before SlowDown

# Object sizes.
# max_single_put_bytes = 5368709120     # 5 GiB (S3 maximum)
# max_part_bytes = 5368709120           # 5 GiB (S3 maximum)
# max_object_bytes = 107374182400       # 100 GiB, assembled multipart object
# max_temporary_bytes = 214748364800    # 200 GiB of in-progress uploads
# max_user_metadata_bytes = 2048

# Disk reserve: writes are refused (503) below max(bytes, percent) free.
# min_disk_free_bytes = 1073741824      # 1 GiB
# min_disk_free_percent = 5
# min_free_inodes = 10000

# API limits.
# max_buckets = 1000
# max_listing_entries = 1000
# max_delete_entries = 1000
# max_xml_body_bytes = 4194304
# max_cors_body_bytes = 65536
# transfer_buffer_bytes = 262144

[multipart]
# max_active_uploads = 1024
# max_parts = 10000
# inactive_expiration_seconds = 604800  # abandoned uploads expire after 7 days
# receipt_retention_seconds = 86400     # idempotent CompleteMultipartUpload retries

[maintenance]
# garbage_batch_size = 100
# garbage_grace_seconds = 60
# garbage_interval_seconds = 60
# shutdown_grace_seconds = 30           # keep below systemd TimeoutStopSec (45s)

[logging]
# format = "json"                       # json or text
# level = "info"                        # error, warn, info, debug, trace
# log_object_keys = false               # object keys can be personal data

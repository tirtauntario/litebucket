# storlite configuration for Docker.
#
# Generate this file with `storlite config template --docker > config.toml`.
# Lines starting with "# key = value" show the built-in default. To change a
# setting, remove the leading "# " and edit the value. Unknown keys are errors.
# Check your edits, then restart:
#   docker compose run --rm storlite config check --config /etc/storlite/config.toml
#   docker compose restart storlite
#
# Units: *_bytes are plain integers (1 GiB = 1073741824); durations carry
# their unit in the name (*_seconds, *_ms).

# Inside the container. /data is the named volume; secrets are mounted
# read-only from ./secrets/ by compose.yaml. Leave these paths as they are.
data_dir = "/data"

# Region that clients must sign requests for. Fixed when the store is
# initialized; startup refuses a different value later.
region = "us-east-1"

[secrets]
# Access keys live in the metadata database. "encrypted" seals each secret
# with AES-256-GCM under the master key file; "plaintext" relies on file
# permissions only (every backup then contains usable secrets). Changing the
# mode converts all stored secrets at the next start; switching to plaintext
# needs the master key one last time.
# protection = "encrypted"
master_key_file = "/run/secrets/storlite-master.key"

[admin]
# Local admin API used by `storlite admin ...` (run it with
# `docker compose exec storlite storlite admin ...`). Only the server's own
# user and root may connect. compose.yaml mounts /run/storlite as tmpfs.
socket = "/run/storlite/admin.sock"

[http]
# S3 API listener. compose.yaml publishes container port 9000.
listen = "0.0.0.0:9000"

# TLS certificate chain and private key (PEM). Required when listening on a
# non-loopback address, unless trusted_proxy_mode is used. Loaded at startup:
# restart after renewing the certificate.
tls_certificate_file = "/run/secrets/storlite-tls.crt"
tls_private_key_file = "/run/secrets/storlite-tls.key"

# Serve plain HTTP behind a TLS-terminating proxy instead of built-in TLS:
# comment out the two tls_* lines above and set both of these. Only the listed
# peer IPs may connect; X-Forwarded-* headers are never trusted.
# trusted_proxy_mode = false
# trusted_proxy_addresses = []          # e.g. ["172.18.0.10"]

# Plain HTTP on 127.0.0.1 only (local development).
# allow_insecure_loopback_http = false

# Request limits.
# max_header_bytes = 32768              # 8 KiB .. 1 MiB
# max_header_count = 128                # 16 .. 1024
# max_request_target_bytes = 16384      # 1 KiB .. 64 KiB
# header_timeout_seconds = 10           # 1 .. 600
# body_idle_timeout_seconds = 60        # 1 .. 3600
# max_clock_skew_seconds = 900          # 60 .. 3600, header-signed requests

[management]
# /livez, /readyz and /metrics. Keep this private: inside the container only.
listen = "127.0.0.1:9001"
# metrics_enabled = true

[database]
# reader_connections = 2                # 1 .. 32
# writer_queue_capacity = 256
# reader_queue_capacity = 128
# busy_timeout_ms = 5000
# queue_wait_ms = 5000                  # wait for queue space before SlowDown

[limits]
# Concurrency.
# active_uploads = 16
# active_downloads = 64
# active_copies = 2
# active_multipart_assemblies = 2
# admission_timeout_ms = 5000           # wait for a slot before SlowDown

# Object sizes.
# max_single_put_bytes = 5368709120     # 5 GiB (S3 maximum)
# max_part_bytes = 5368709120           # 5 GiB (S3 maximum)
# max_object_bytes = 107374182400       # 100 GiB, assembled multipart object
# max_temporary_bytes = 214748364800    # 200 GiB of in-progress uploads
# max_user_metadata_bytes = 2048

# Disk reserve: writes are refused (503) below max(bytes, percent) free.
# min_disk_free_bytes = 1073741824      # 1 GiB
# min_disk_free_percent = 5
# min_free_inodes = 10000

# API limits.
# max_buckets = 1000
# max_listing_entries = 1000
# max_delete_entries = 1000
# max_xml_body_bytes = 4194304
# max_cors_body_bytes = 65536
# transfer_buffer_bytes = 262144

[multipart]
# max_active_uploads = 1024
# max_parts = 10000
# inactive_expiration_seconds = 604800  # abandoned uploads expire after 7 days
# receipt_retention_seconds = 86400     # idempotent CompleteMultipartUpload retries

[maintenance]
# garbage_batch_size = 100
# garbage_grace_seconds = 60
# garbage_interval_seconds = 60
# shutdown_grace_seconds = 30           # keep below compose stop_grace_period (40s)

[logging]
# format = "json"                       # json or text
# level = "info"                        # error, warn, info, debug, trace
# log_object_keys = false               # object keys can be personal data

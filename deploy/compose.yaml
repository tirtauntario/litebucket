# Single-process deployment: no database or worker containers.
# See docs/installation.md#docker for the full walkthrough. In short:
#   1. put credentials.toml, tls.crt and tls.key in ./secrets/
#      (on Linux: chown 65532:65532 secrets/* && chmod 0400 secrets/*)
#   2. docker compose run --rm storlite init --config /etc/storlite/config.toml
#   3. docker compose up -d
# To run a locally built image instead of the published one:
#   docker build -f deploy/Dockerfile -t storlite:local .
#   STORLITE_IMAGE=storlite:local docker compose up -d
services:
  storlite:
    image: ${STORLITE_IMAGE:-ghcr.io/tirtauntario/storlite:latest}
    ports:
      - "9000:9000"
    volumes:
      - storlite-data:/data
      - ./config.container.toml:/etc/storlite/config.toml:ro
    secrets:
      - source: storlite-credentials
        target: storlite-credentials.toml
      - source: storlite-tls-crt
        target: storlite-tls.crt
      - source: storlite-tls-key
        target: storlite-tls.key
    # Stop the old process before starting a new one: never two writers.
    stop_grace_period: 40s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ulimits:
      nofile: { soft: 8192, hard: 8192 }

secrets:
  storlite-credentials:
    file: ./secrets/credentials.toml
  storlite-tls-crt:
    file: ./secrets/tls.crt
  storlite-tls-key:
    file: ./secrets/tls.key

volumes:
  storlite-data:

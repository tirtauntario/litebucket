# storlite with Docker Compose: one container, no database or worker services.
#
# Easiest setup (creates config.toml, .env and secrets/, then starts):
#   curl -fsSL https://raw.githubusercontent.com/tirtauntario/storlite/main/deploy/setup.sh | sh
#
# Files next to this one:
#   .env          STORLITE_IMAGE (pinned version) and STORLITE_PORT
#   config.toml   server settings; edit, then `docker compose restart`
#   secrets/      credentials.toml, tls.crt, tls.key (owned by uid 65532 on Linux)
# Manual setup and operations: docs/installation.md#docker
services:
  storlite:
    image: ${STORLITE_IMAGE:-ghcr.io/tirtauntario/storlite:latest}
    ports:
      - "${STORLITE_PORT:-9000}:9000"
    volumes:
      - storlite-data:/data
      - ./config.toml:/etc/storlite/config.toml:ro
    secrets:
      - source: storlite-credentials
        target: storlite-credentials.toml
      - source: storlite-tls-crt
        target: storlite-tls.crt
      - source: storlite-tls-key
        target: storlite-tls.key
    # Stop the old process before starting a new one: never two writers.
    stop_grace_period: 40s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ulimits:
      nofile: { soft: 8192, hard: 8192 }

secrets:
  storlite-credentials:
    file: ./secrets/credentials.toml
  storlite-tls-crt:
    file: ./secrets/tls.crt
  storlite-tls-key:
    file: ./secrets/tls.key

volumes:
  storlite-data:

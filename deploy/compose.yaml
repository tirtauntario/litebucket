# litebucket with Docker Compose: one container, no database or worker services.
#
# Easiest setup (creates config.toml, .env and secrets/, then starts):
#   curl -fsSL https://raw.githubusercontent.com/tirtauntario/litebucket/main/deploy/setup.sh | sh
#
# Files next to this one:
#   .env          LITEBUCKET_IMAGE (pinned version) and LITEBUCKET_PORT
#   config.toml   server settings; edit, then `docker compose restart`
#   secrets/      master.key, tls.crt, tls.key (owned by uid 65532 on Linux)
# Manage access keys and buckets:
#   docker compose exec litebucket litebucket admin key list
# Manual setup and operations: docs/installation.md#docker
services:
  litebucket:
    image: ${LITEBUCKET_IMAGE:-ghcr.io/tirtauntario/litebucket:latest}
    ports:
      - "${LITEBUCKET_PORT:-9000}:9000"
    volumes:
      - litebucket-data:/data
      - ./config.toml:/etc/litebucket/config.toml:ro
    # The admin API socket lives here (in memory, owner-only).
    tmpfs:
      - /run/litebucket:uid=65532,gid=65532,mode=0700
    secrets:
      - source: litebucket-master-key
        target: litebucket-master.key
      - source: litebucket-tls-crt
        target: litebucket-tls.crt
      - source: litebucket-tls-key
        target: litebucket-tls.key
    # Stop the old process before starting a new one: never two writers.
    stop_grace_period: 40s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ulimits:
      nofile: { soft: 8192, hard: 8192 }

secrets:
  litebucket-master-key:
    file: ./secrets/master.key
  litebucket-tls-crt:
    file: ./secrets/tls.crt
  litebucket-tls-key:
    file: ./secrets/tls.key

volumes:
  litebucket-data:

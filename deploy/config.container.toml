# Container configuration. Secrets (credentials, TLS key) are mounted
# read-only; only /data is writable. Paths are absolute.
# All other settings use the defaults in docs/examples/config.example.toml.
data_dir = "/data"
region = "us-east-1"
credentials_file = "/run/secrets/storlite-credentials.toml"
# Compose file secrets are bind mounts that keep the host file's mode, so the
# credentials file must be 0600/0400 and readable by uid 65532. Set this to
# true only if your orchestrator mounts it 0440 with a dedicated group.
# World-readable files are always refused.
# credentials_allow_group_read = false

[http]
listen = "0.0.0.0:9000"
tls_certificate_file = "/run/secrets/storlite-tls.crt"
tls_private_key_file = "/run/secrets/storlite-tls.key"

[management]
# Keep the management listener private: bound inside the container only.
listen = "127.0.0.1:9001"

[logging]
format = "json"
level = "info"

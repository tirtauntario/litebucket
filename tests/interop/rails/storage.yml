# Active Storage service pointing at the local litebucket under test.
litebucket:
  service: S3
  endpoint: <%= ENV.fetch("LITEBUCKET_ENDPOINT") %>
  region: <%= ENV.fetch("LITEBUCKET_REGION") %>
  bucket: <%= ENV.fetch("LITEBUCKET_RAILS_BUCKET") %>
  access_key_id: <%= ENV.fetch("LITEBUCKET_KEY_ID") %>
  secret_access_key: <%= ENV.fetch("LITEBUCKET_SECRET") %>
  force_path_style: true
  <% if ENV["LITEBUCKET_CA_BUNDLE"] %>ssl_ca_bundle: <%= ENV["LITEBUCKET_CA_BUNDLE"] %><% end %>
  public: false
